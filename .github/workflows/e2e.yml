name: E2E

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # backend/main.py imports the WeasyPrint PDF generator at startup,
      # so the web-service won't boot without these system libraries.
      - name: Install system libraries (WeasyPrint PDF rendering)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install Python dependencies (both services)
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # playwright.config.js boots the real three-service topology itself
      # (web-service :8000, analysis-service :8001, Vite :5173) and injects
      # the hermetic env: USE_MOCK, closed-port Supabase URL, empty search
      # keys. No live API is ever called and no secret is required.
      - name: Run E2E tests
        working-directory: e2e
        env:
          CI: 'true'
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
