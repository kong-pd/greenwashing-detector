name: Backend CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system libraries (WeasyPrint PDF rendering)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check scraper
        run: python -m py_compile analysis/scraper.py analysis/enricher.py analysis/analyzer.py

      - name: Run backend tests
        env:
          USE_MOCK: "true"
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"
          GEMINI_API_KEY: "placeholder"
          GROQ_API_KEY: "placeholder"
          SERPER_API_KEY: "placeholder"
          GUARDIAN_API_KEY: "placeholder"
          ANTHROPIC_API_KEY: "placeholder"
          ANALYSIS_SERVICE_URL: "http://localhost:8001"
        run: pytest backend/tests/ -v

  test-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check scraper
        run: python -m py_compile analysis/scraper.py analysis/enricher.py analysis/analyzer.py

      - name: Run analysis tests
        env:
          USE_MOCK: "true"
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"
          GEMINI_API_KEY: "placeholder"
          GROQ_API_KEY: "placeholder"
          SERPER_API_KEY: "placeholder"
          GUARDIAN_API_KEY: "placeholder"
          ANTHROPIC_API_KEY: "placeholder"
        run: pytest analysis/tests/ -v
